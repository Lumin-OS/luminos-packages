# LuminOS's initramfs hooks: systemd-based, with microcode (the UKIs get
# it from this hook) and fsck (fsck.btrfs checks the btrfs root). This is
# mkinitcpio 42's own default, pinned here so a new default upstream
# doesn't change LuminOS's initramfs unnoticed.
#
# A drop-in, because the mkinitcpio package owns /etc/mkinitcpio.conf.
# The live ISO's archiso preset names its own config, and mkinitcpio then
# skips drop-ins, so this doesn't touch the live initramfs.
HOOKS=(base systemd autodetect microcode modconf kms keyboard sd-vconsole block filesystems fsck)
